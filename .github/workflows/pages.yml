# Déploie le diaporama (dossier presentation/) sur GitHub Pages à chaque push sur main.
# Les diagrammes sont déjà générés dans presentation/assets/diagrams.js (versionné) :
# aucune étape de build n'est nécessaire.
name: Déployer le diaporama

on:
  push:
    branches: [main]
    paths: ["presentation/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: presentation
      - id: deployment
        uses: actions/deploy-pages@v4
