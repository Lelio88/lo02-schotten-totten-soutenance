# Vérifie à chaque push et pull request que le projet compile, que les tests passent
# (la vérification de la Javadoc, `./mvnw javadoc:javadoc`, s'ajoutera ici dès que le premier
# code public existera : javadoc refuse un projet sans classe publique).
name: Intégration continue

on:
  push:
    branches: [main]
    paths-ignore: ["presentation/**", "doc/**"]
  pull_request:
    paths-ignore: ["presentation/**", "doc/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compiler et tester
        run: ./mvnw -B verify
